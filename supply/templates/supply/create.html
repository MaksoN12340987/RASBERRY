{% extends 'supply/base.html' %}

{% block title %}
    Создание кнопки
{% endblock %}

{% block page_title %}
    <h1>Создание кнопки</h1>
{% endblock %}

{% block content %}
    <div class="container vh-100">
                
        <div class="card rounded-3 ms-2 me-2 p-2 text-start bg-dark text-white">
            <form method="post" class="bg-dark text-white" enctype="multipart/form-data">
                        
                {% csrf_token %}
                        
                {{ form.as_p }}
                        
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>

    </div>
{% endblock %}


{% block bottom %}
    <div class="row p-2 mt-2">
        <div class="col-3"></div>

        <div class="col-6">
        <div class="row p-1">
            <div class="col-4 mt-1"></div>
        
            <div class="col-4 text-post-title">
            <div class="d-grid gap-2">
                <a href="{% url 'supply:home' %}" class="btn btn-success">На главную...</a>
            </div>
            </div>
        
            <div class="col-4 mt-1"></div>
        
        </div>
        </div>

        <div class="col-3"></div>

    </div>
{% endblock %}
